<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin - Revolution MD</title>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: sans-serif; padding: 20px; }
        .container { max-width: 850px; margin: auto; background: #161b22; padding: 25px; border-radius: 10px; border: 1px solid #30363d; }
        h2 { color: #58a6ff; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 12px 20px; background: #238636; border: none; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .section-box { border: 1px solid #30363d; padding: 15px; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🛠️ Panel Admin Revolution MD</h2>
        
        <div id="authSection">
            <label>Mot de passe Admin</label>
            <input type="password" id="adminPass" placeholder="Entrez le mot de passe (@#xbot#@)">
            <button onclick="loadAdminConfig()">Se connecter</button>
        </div>

        <div id="panelForm" style="display:none;">
            <label>Nom du Bot</label>
            <input type="text" id="botName">

            <label>Préfixe</label>
            <input type="text" id="prefix">

            <label>Instructions Système du Chatbot (Personnalité / Rôle)</label>
            <textarea id="chatbotInstructions" rows="3"></textarea>

            <label>URLs Images/Vidéos du Menu (Séparées par virgule)</label>
            <textarea id="menuMedia" rows="2"></textarea>

            <div class="section-box">
                <h3>📢 Auto-Post Statut WhatsApp (Tous les numéros connectés)</h3>
                <label>Texte du Statut</label>
                <textarea id="statusPostText" placeholder="Écrivez le message de statut à diffuser..."></textarea>
                <button type="button" onclick="postStatus()">Publier le statut sur tous les bots</button>
                <span id="postStatusResult"></span>
            </div>

            <button onclick="saveAdminConfig()">Sauvegarder les configurations</button>
            <p id="statusMsg" style="color: #3fb950;"></p>
        </div>
    </div>

    <script>
        let currentPass = '';

        async function loadAdminConfig() {
            currentPass = document.getElementById('adminPass').value;
            const res = await fetch('/api/admin/config', { headers: { 'x-admin-pass': currentPass } });
            if (res.status === 403) return alert('Mot de passe incorrect !');
            const data = await res.json();
            
            document.getElementById('botName').value = data.botName || '';
            document.getElementById('prefix').value = data.prefix || '';
            document.getElementById('chatbotInstructions').value = data.chatbotInstructions || '';
            document.getElementById('menuMedia').value = (data.menuMedia || []).join(', ');

            document.getElementById('authSection').style.display = 'none';
            document.getElementById('panelForm').style.display = 'block';
        }

        async function saveAdminConfig() {
            const body = {
                botName: document.getElementById('botName').value,
                prefix: document.getElementById('prefix').value,
                chatbotInstructions: document.getElementById('chatbotInstructions').value,
                menuMedia: document.getElementById('menuMedia').value.split(',').map(s => s.trim()).filter(Boolean)
            };

            const res = await fetch('/api/admin/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-pass': currentPass },
                body: JSON.stringify(body)
            });

            if (res.ok) {
                document.getElementById('statusMsg').innerText = 'Configuration mise à jour avec succès !';
            }
        }

        async function postStatus() {
            const text = document.getElementById('statusPostText').value;
            if (!text) return alert('Écris un texte !');

            const res = await fetch('/api/admin/post-status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-pass': currentPass },
                body: JSON.stringify({ text })
            });
            const data = await res.json();
            document.getElementById('postStatusResult').innerText = ' ✅ ' + data.message;
        }
    </script>
</body>
</html>
