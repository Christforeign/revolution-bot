<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revolution MD - Connecter votre Bot</title>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 30px; width: 90%; max-width: 420px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
        h1 { color: #58a6ff; font-size: 24px; margin-bottom: 8px; }
        p { font-size: 14px; color: #8b949e; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #30363d; border-radius: 6px; background: #0d1117; color: #fff; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #238636; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #2ea043; }
        #codeBox { display: none; margin-top: 20px; padding: 15px; background: #21262d; border-radius: 8px; font-family: monospace; font-size: 22px; color: #3fb950; letter-spacing: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>REVOLUTION MD</h1>
        <p>Entrez votre numéro WhatsApp (ex: 50937081286) pour obtenir votre Pairing Code.</p>
        <input type="text" id="phone" placeholder="Numéro avec indicatif (sans +)">
        <button onclick="requestPairing()">OBTENIR LE PAIRING CODE</button>
        <div id="codeBox"></div>
    </div>

    <script>
        async function requestPairing() {
            const phone = document.getElementById('phone').value.trim();
            const codeBox = document.getElementById('codeBox');
            if (!phone) return alert('Veuillez entrer un numéro !');

            codeBox.style.display = 'block';
            codeBox.innerText = 'Génération en cours...';

            try {
                const res = await fetch('/api/pairing', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
                const data = await res.json();
                if (data.code) {
                    codeBox.innerText = data.code;
                } else {
                    codeBox.innerText = data.error || 'Erreur inconnue';
                }
            } catch (err) {
                codeBox.innerText = 'Erreur serveur';
            }
        }
    </script>
</body>
</html>
